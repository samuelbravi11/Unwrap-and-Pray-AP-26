[package]
name = "cartographer"
version.workspace = true
edition.workspace = true

[dependencies]
bevy = { version = "0.19.1", features = ["dynamic_linking"] }
chrono = { version = "0.4", features = ["clock"] }
rand = "0.10.3"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = "thin"
