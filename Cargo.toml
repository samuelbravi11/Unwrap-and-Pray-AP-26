[workspace]
resolver = "2"
members = ["crates/*"]


[workspace.package]
name = "AP-project-UnwrapAndPray"
version = "1.99.1"
edition = "2024"

[workspace.dependencies]
admiralty = { path = "crates/admiralty" }
cartographer = { path = "crates/cartographer" }
chart = { path = "crates/chart" }
islands = { path = "crates/islands" }
ships = { path = "crates/ships" }

[package]
name = "main"
version.workspace = true
edition.workspace = true

[[bin]]
name = "game"
path = "src/main.rs"

[dependencies]
admiralty = { workspace = true }
#cartographer = { workspace = true } // KEEP COMMENTED BECAUSE GUI DEPENDENCIES ARE REALLY HEAVY (~30GB)
chart = { workspace = true }
islands = { workspace = true }
ships = { workspace = true }
